name: CI/CD Pipeline
on: 
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  launch:
    strategy:
      fail-fast: false
    name: PHP
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Setup Task
        uses: go-task/setup-task@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build with matrix
        id: check_docker
        run: task exec VERSIONS=8.4

      - name: "Show images"
        run: docker images

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Push Docker
        run: task push

      - name: Commit manifest-checks changes
        run: |
          if [ -n "$(git status --porcelain manifest-checks.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add manifest-checks.txt
            git commit -m "chore(ci): update manifest-checks.txt"
            git push
          else
            echo "No changes on manifest-checks.txt"
          fi
    