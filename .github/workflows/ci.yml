name: CI
# Contrôles rapides à chaque push/PR : aucun build ni push d'image ici.
# Les builds ont lieu uniquement dans release.yml (nouvelle version PHP détectée).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint duplication
        run: npm run lint:duplication

      - name: Validate Taskfile
        run: task --list-all > /dev/null

      - name: Generate sample Dockerfiles
        run: |
          task create FOLDER=apache VERSION=8.4.0 NUMBER=8.4
          task create FOLDER=fpm VERSION=8.4.0 NUMBER=8.4
          ! grep -q 'VERSIONIMAGE\|PHPEXTENSIONS\|PHPLISTEXTENSION\|PKGINSTALL\|SYMFONYCLI\|WORDPRESSPHAR\|EXPOSEPORT' build/apache/8.4.0/Dockerfile build/fpm/8.4.0/Dockerfile

      - name: Check upstream tool URLs
        run: |
          while read -r line; do
            case "$line" in
              \#*|"") continue ;;
            esac
            url="${line#*=}"
            curl -fsSL -o /dev/null --max-time 30 "$url"
            echo "OK: $url"
          done < versions.env
